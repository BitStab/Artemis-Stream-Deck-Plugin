<!doctype html>
<html>
<head lang="en">
    <meta charset="utf-8" />
    <title>Artemis Connection</title>
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
    <style>
        .status { font: 12px system-ui, sans-serif; margin: 8px 12px; opacity: .85; }
        .ok { color: #73d673; }
        .error { color: #ff7b72; }
        select, input { width: 100%; box-sizing: border-box; }
        .row { display: flex; gap: 6px; width: 100%; }
        .row input:first-child { flex: 1; }
        .port { max-width: 85px; }
        button { width: 100%; min-height: 28px; }
    </style>
</head>
<body>
    <sdpi-item label="Protocol">
        <select id="protocol"><option value="http">HTTP</option><option value="https">HTTPS</option></select>
    </sdpi-item>
    <sdpi-item label="Artemis">
        <div class="row">
            <input id="host" type="text" placeholder="127.0.0.1" />
            <input id="port" class="port" type="number" min="1" max="65535" placeholder="9696" />
        </div>
    </sdpi-item>
    <sdpi-item label="Connection"><button id="test">Test Connection</button></sdpi-item>
    <div id="status" class="status">Loading…</div>
<script>
    const DEFAULTS = { protocol: "http", host: "127.0.0.1", port: 9696 };
    const protocolEl = document.getElementById("protocol");
    const hostEl = document.getElementById("host");
    const portEl = document.getElementById("port");
    const testEl = document.getElementById("test");
    const statusEl = document.getElementById("status");
    let client;

    function baseUrl() {
        return `${protocolEl.value === "https" ? "https" : "http"}://${hostEl.value.trim() || DEFAULTS.host}:${Number(portEl.value) || DEFAULTS.port}/`;
    }

    async function save() {
        await client.setGlobalSettings({
            protocol: protocolEl.value === "https" ? "https" : "http",
            host: hostEl.value.trim() || DEFAULTS.host,
            port: Number(portEl.value) || DEFAULTS.port
        });
    }

    async function test() {
        testEl.disabled = true;
        statusEl.className = "status";
        statusEl.textContent = "Connecting to Artemis…";
        try {
            await save();
            const response = await fetch(new URL("profiles", baseUrl()), { headers: { Accept: "application/json" } });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const profiles = await response.json();
            statusEl.className = "status ok";
            statusEl.textContent = `Connected to ${baseUrl()} — ${profiles.length} profile(s).`;
        } catch (error) {
            statusEl.className = "status error";
            statusEl.textContent = `Connection failed: ${error?.message ?? error}`;
        } finally {
            testEl.disabled = false;
        }
    }

    async function init() {
        client = SDPIComponents.streamDeckClient;
        const global = await client.getGlobalSettings();
        protocolEl.value = global.protocol === "https" ? "https" : DEFAULTS.protocol;
        hostEl.value = global.host || DEFAULTS.host;
        portEl.value = global.port || DEFAULTS.port;
        await test();
    }

    testEl.addEventListener("click", test);
    protocolEl.addEventListener("change", save);
    hostEl.addEventListener("change", save);
    portEl.addEventListener("change", save);

    window.addEventListener("DOMContentLoaded", () => {
        const wait = setInterval(() => {
            if (window.SDPIComponents?.streamDeckClient) {
                clearInterval(wait);
                init().catch(error => {
                    statusEl.className = "status error";
                    statusEl.textContent = `Initialization failed: ${error?.message ?? error}`;
                });
            }
        }, 50);
        setTimeout(() => clearInterval(wait), 10000);
    });
</script>
</body>
</html>
