<!doctype html><html><head lang="en"><meta charset="utf-8"/><title>Artemis Variable Dial</title><script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script><style>body{padding-bottom:10px}.status{font:12px system-ui,sans-serif;margin:8px 12px;opacity:.85}.ok{color:#73d673}.error{color:#ff7b72}input,select{width:100%;box-sizing:border-box}.row{display:flex;gap:6px;width:100%}.row>*{flex:1}.port{max-width:85px}</style></head><body>
<sdpi-item label="Protocol"><select id="protocol"><option value="http">HTTP</option><option value="https">HTTPS</option></select></sdpi-item>
<sdpi-item label="Artemis"><div class="row"><input id="host" placeholder="127.0.0.1"/><input id="port" class="port" type="number" min="1" max="65535" placeholder="9696"/></div></sdpi-item><div id="status" class="status">Checking JSON Modules API…</div>
<sdpi-item label="Module ID"><input id="moduleId" placeholder="streamdeck"/></sdpi-item><sdpi-item label="Variable"><input id="variableName" placeholder="brightness"/></sdpi-item><sdpi-item label="Label"><input id="label" placeholder="Brightness"/></sdpi-item>
<sdpi-item label="Range"><div class="row"><input id="minimum" type="number" placeholder="0"/><input id="maximum" type="number" placeholder="100"/><input id="step" type="number" step="any" placeholder="1"/></div></sdpi-item>
<sdpi-item label="Default"><div class="row"><input id="defaultValue" type="number" step="any" placeholder="50"/><input id="suffix" placeholder="%"/></div></sdpi-item>
<div class="status">Rotate = change value. Press = reset to default. The number variable is created automatically in Artemis.</div>
<script>
const D={protocol:"http",host:"127.0.0.1",port:9696,moduleId:"streamdeck",minimum:0,maximum:100,step:1,defaultValue:50};let client,s={};const $=id=>document.getElementById(id);const protocol=$("protocol"),host=$("host"),port=$("port"),moduleId=$("moduleId"),variableName=$("variableName"),label=$("label"),minimum=$("minimum"),maximum=$("maximum"),step=$("step"),defaultValue=$("defaultValue"),suffix=$("suffix"),status=$("status");
const num=(v,d)=>Number.isFinite(Number(v))?Number(v):d;function base(){return`${protocol.value==="https"?"https":"http"}://${host.value.trim()||D.host}:${Number(port.value)||D.port}/`}
async function globals(){await client.setGlobalSettings({protocol:protocol.value==="https"?"https":"http",host:host.value.trim()||D.host,port:Number(port.value)||D.port});}
async function check(){try{await globals();const r=await fetch(new URL("json-modules",base()),{headers:{Accept:"application/json"}});if(!r.ok)throw new Error(`HTTP ${r.status}`);status.className="status ok";status.textContent="JSON Modules API available";}catch(e){status.className="status error";status.textContent=`JSON Modules API unavailable: ${e?.message??e}`;}}
async function save(){const min=num(minimum.value,D.minimum),max=num(maximum.value,D.maximum),def=num(defaultValue.value,D.defaultValue);s={...s,moduleId:moduleId.value.trim()||D.moduleId,variableName:variableName.value.trim()||undefined,label:label.value.trim()||undefined,minimum:min,maximum:max,step:Math.abs(num(step.value,D.step))||1,defaultValue:def,suffix:suffix.value,currentValue:s.currentValue??def};await client.setSettings(s);}
async function init(){client=SDPIComponents.streamDeckClient;const g=await client.getGlobalSettings()||{};const p=await client.getSettings();s=p?.settings??p??{};protocol.value=g.protocol==="https"?"https":D.protocol;host.value=g.host||D.host;port.value=g.port||D.port;moduleId.value=s.moduleId||D.moduleId;variableName.value=s.variableName||"";label.value=s.label||"";minimum.value=s.minimum??D.minimum;maximum.value=s.maximum??D.maximum;step.value=s.step??D.step;defaultValue.value=s.defaultValue??D.defaultValue;suffix.value=s.suffix??"";await check();}
[protocol,host,port].forEach(x=>x.addEventListener("change",check));[moduleId,variableName,label,minimum,maximum,step,defaultValue,suffix].forEach(x=>x.addEventListener("change",save));window.addEventListener("DOMContentLoaded",()=>{const w=setInterval(()=>{if(window.SDPIComponents?.streamDeckClient){clearInterval(w);init();}},50);setTimeout(()=>clearInterval(w),10000);});
</script></body></html>
