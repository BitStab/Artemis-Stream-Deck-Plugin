<!doctype html>
<html><head lang="en"><meta charset="utf-8"/><title>Artemis Variable Toggle</title>
<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
<style>body{padding-bottom:10px}.status{font:12px system-ui,sans-serif;margin:8px 12px;opacity:.85}.ok{color:#73d673}.error{color:#ff7b72}input,select{width:100%;box-sizing:border-box}.row{display:flex;gap:6px;width:100%}.row input:first-child{flex:1}.port{max-width:85px}.hidden{display:none}</style></head><body>
<sdpi-item label="Protocol"><select id="protocol"><option value="http">HTTP</option><option value="https">HTTPS</option></select></sdpi-item>
<sdpi-item label="Artemis"><div class="row"><input id="host" placeholder="127.0.0.1"/><input id="port" class="port" type="number" min="1" max="65535" placeholder="9696"/></div></sdpi-item>
<div id="status" class="status">Loading Artemis variables…</div>
<sdpi-item label="Module"><select id="moduleSelect"></select></sdpi-item>
<sdpi-item id="moduleManualItem" class="hidden" label="New module"><input id="moduleManual" placeholder="streamdeck"/></sdpi-item>
<sdpi-item label="Variable"><select id="variableSelect"></select></sdpi-item>
<sdpi-item id="variableManualItem" class="hidden" label="New variable"><input id="variableManual" placeholder="gamingMode"/></sdpi-item>
<sdpi-item label="Label"><input id="label" placeholder="Gaming Mode"/></sdpi-item>
<div id="current" class="status">Boolean variables are read from Artemis. Press toggles the current value.</div>
<script>
const D={protocol:"http",host:"127.0.0.1",port:9696,moduleId:"streamdeck"};let client,s={},modules=[];const $=id=>document.getElementById(id),protocol=$("protocol"),host=$("host"),port=$("port"),moduleSelect=$("moduleSelect"),moduleManual=$("moduleManual"),moduleManualItem=$("moduleManualItem"),variableSelect=$("variableSelect"),variableManual=$("variableManual"),variableManualItem=$("variableManualItem"),label=$("label"),status=$("status"),current=$("current");
const pick=(o,...k)=>{for(const x of k)if(o?.[x]!=null)return o[x]},rec=v=>v&&typeof v==="object"&&!Array.isArray(v);function base(){return`${protocol.value==="https"?"https":"http"}://${host.value.trim()||D.host}:${Number(port.value)||D.port}/`}async function globals(){await client.setGlobalSettings({protocol:protocol.value==="https"?"https":"http",host:host.value.trim()||D.host,port:Number(port.value)||D.port});}
function normModule(x){const id=String(pick(x,"moduleId","ModuleId")??"");const schema=pick(x,"schema","Schema")||{};const props=rec(schema.properties)?schema.properties:(rec(schema.Properties)?schema.Properties:{});return{moduleId:id,schema,vars:Object.entries(props).map(([name,v])=>({name,title:String(pick(v,"title","Title")??name),type:String(pick(v,"type","Type")??"").toLowerCase()}))}}
function selectedModuleId(){return moduleSelect.value==="__new__"?(moduleManual.value.trim()||D.moduleId):moduleSelect.value}function selectedVariable(){return variableSelect.value==="__new__"?variableManual.value.trim():variableSelect.value}
function show(el,on){el.classList.toggle("hidden",!on)}
function populateModules(){const wanted=s.moduleId||D.moduleId;moduleSelect.innerHTML="";for(const m of modules){const o=new Option(m.moduleId,m.moduleId);moduleSelect.add(o)}const exists=modules.some(m=>m.moduleId===wanted);moduleSelect.add(new Option("+ New / manual…","__new__"));if(exists)moduleSelect.value=wanted;else{moduleSelect.value="__new__";moduleManual.value=wanted}show(moduleManualItem,moduleSelect.value==="__new__");populateVariables();}
function populateVariables(){const m=modules.find(x=>x.moduleId===selectedModuleId());const vars=(m?.vars||[]).filter(v=>v.type==="boolean");const wanted=s.variableName||"";variableSelect.innerHTML="";for(const v of vars)variableSelect.add(new Option(v.title===v.name?v.name:`${v.title} (${v.name})`,v.name));variableSelect.add(new Option("+ New boolean variable…","__new__"));if(vars.some(v=>v.name===wanted))variableSelect.value=wanted;else{variableSelect.value="__new__";variableManual.value=wanted}show(variableManualItem,variableSelect.value==="__new__");}
async function readCurrent(){const mid=selectedModuleId(),vn=selectedVariable();if(!vn){current.textContent="Select or enter a boolean variable.";return}try{const r=await fetch(new URL("data-model",base()),{headers:{Accept:"application/json"}});if(!r.ok)throw new Error(`Data Model HTTP ${r.status}`);const root=await r.json(),obj=findObj(root,mid);const e=obj&&Object.entries(obj).find(([k])=>k.toLowerCase()===vn.toLowerCase());current.className="status "+(e?"ok":"");current.textContent=e?`Current Artemis value: ${String(e[1])}`:"Variable is not in the data model yet; it will be created on first use."}catch(e){current.className="status error";current.textContent=`Current value unavailable: ${e?.message??e}`}}
function findObj(root,name){const w=name.toLowerCase(),seen=new Set();function walk(v){if(!v||typeof v!=="object"||seen.has(v))return;seen.add(v);if(Array.isArray(v)){for(const c of v){const f=walk(c);if(f)return f}return}for(const [k,c] of Object.entries(v))if(k.toLowerCase()===w&&rec(c))return c;for(const c of Object.values(v)){const f=walk(c);if(f)return f}}return walk(root)}
async function load(){status.className="status";status.textContent="Loading Artemis variables…";try{await globals();const [jr,dr]=await Promise.all([fetch(new URL("json-modules",base()),{headers:{Accept:"application/json"}}),fetch(new URL("data-model",base()),{headers:{Accept:"application/json"}})]);if(!jr.ok)throw new Error(`JSON Modules HTTP ${jr.status}`);if(!dr.ok)throw new Error(`Data Model HTTP ${dr.status}`);const raw=await jr.json();modules=Array.isArray(raw)?raw.map(normModule).filter(x=>x.moduleId):[];populateModules();status.className="status ok";status.textContent=`Connected · ${modules.length} JSON module(s)`;await readCurrent()}catch(e){status.className="status error";status.textContent=`Artemis API unavailable: ${e?.message??e}`;modules=[];populateModules();}}
async function save(){s={...s,moduleId:selectedModuleId(),variableName:selectedVariable()||undefined,label:label.value.trim()||undefined};await client.setSettings(s);await readCurrent()}
async function init(){client=SDPIComponents.streamDeckClient;const g=await client.getGlobalSettings()||{},p=await client.getSettings();s=p?.settings??p??{};protocol.value=g.protocol==="https"?"https":D.protocol;host.value=g.host||D.host;port.value=g.port||D.port;label.value=s.label||"";await load()}
moduleSelect.addEventListener("change",async()=>{show(moduleManualItem,moduleSelect.value==="__new__");populateVariables();await save()});moduleManual.addEventListener("change",async()=>{populateVariables();await save()});variableSelect.addEventListener("change",async()=>{show(variableManualItem,variableSelect.value==="__new__");await save()});[variableManual,label].forEach(x=>x.addEventListener("change",save));[protocol,host,port].forEach(x=>x.addEventListener("change",load));window.addEventListener("DOMContentLoaded",()=>{const w=setInterval(()=>{if(window.SDPIComponents?.streamDeckClient){clearInterval(w);init()}},50);setTimeout(()=>clearInterval(w),10000)});
</script></body></html>
