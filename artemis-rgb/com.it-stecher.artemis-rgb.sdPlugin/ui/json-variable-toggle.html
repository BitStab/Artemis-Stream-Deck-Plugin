<!doctype html><html><head lang="en"><meta charset="utf-8"/><title>Artemis Variable Button</title><script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
<style>body{padding-bottom:10px}.status{font:12px system-ui,sans-serif;margin:8px 12px;opacity:.85}.ok{color:#73d673}.error{color:#ff7b72}input,select{width:100%;box-sizing:border-box}.row{display:flex;gap:6px;width:100%}.row input:first-child{flex:1}.port{max-width:85px}.hidden{display:none}</style></head><body>
<sdpi-item label="Protocol"><select id="protocol"><option value="http">HTTP</option><option value="https">HTTPS</option></select></sdpi-item><sdpi-item label="Artemis"><div class="row"><input id="host"/><input id="port" class="port" type="number"/></div></sdpi-item><div id="status" class="status">Loading Artemis variables…</div>
<sdpi-item label="Module"><select id="module"></select></sdpi-item><sdpi-item id="moduleManualItem" class="hidden" label="New module"><input id="moduleManual" value="streamdeck"/></sdpi-item>
<sdpi-item label="Variable"><select id="variable"></select></sdpi-item><sdpi-item id="variableManualItem" class="hidden" label="New variable"><input id="variableManual"/></sdpi-item>
<sdpi-item id="typeItem" label="Type"><select id="type"><option value="boolean">Boolean</option><option value="number">Number</option><option value="integer">Integer</option><option value="string">String</option></select></sdpi-item>
<sdpi-item label="Label"><input id="label"/></sdpi-item><sdpi-item id="valueItem" class="hidden" label="Value"><input id="setValue"/></sdpi-item><div id="hint" class="status">Boolean: press toggles. Other scalar types: press writes the configured value.</div>
<script>
const D={protocol:'http',host:'127.0.0.1',port:9696,moduleId:'streamdeck'};let c,s={},mods=[];const $=x=>document.getElementById(x),protocol=$('protocol'),host=$('host'),port=$('port'),module=$('module'),moduleManual=$('moduleManual'),variable=$('variable'),variableManual=$('variableManual'),type=$('type'),label=$('label'),setValue=$('setValue'),status=$('status'),typeItem=$('typeItem'),valueItem=$('valueItem'),moduleManualItem=$('moduleManualItem'),variableManualItem=$('variableManualItem');const rec=v=>v&&typeof v==='object'&&!Array.isArray(v),pick=(o,...k)=>{for(const x of k)if(o?.[x]!=null)return o[x]};
function base(){return`${protocol.value==='https'?'https':'http'}://${host.value.trim()||D.host}:${Number(port.value)||D.port}/`}function mid(){return module.value==='__new__'?(moduleManual.value.trim()||D.moduleId):module.value}function vn(){return variable.value==='__new__'?variableManual.value.trim():variable.value}function show(e,on){e.classList.toggle('hidden',!on)}
function parse(x){const id=String(pick(x,'moduleId','ModuleId')??''),sc=pick(x,'schema','Schema')||{},ps=rec(sc.properties)?sc.properties:(rec(sc.Properties)?sc.Properties:{});return{moduleId:id,vars:Object.entries(ps).map(([name,v])=>({name,title:String(pick(v,'title','Title')??name),type:String(pick(v,'type','Type')??'').toLowerCase(),def:pick(v,'default','Default'),enumValues:Array.isArray(pick(v,'enum','Enum'))?pick(v,'enum','Enum'):[]}))}}
function populateModules(){const want=s.moduleId||D.moduleId;module.innerHTML='';mods.forEach(m=>module.add(new Option(m.moduleId,m.moduleId)));module.add(new Option('+ New / manual…','__new__'));if(mods.some(m=>m.moduleId===want))module.value=want;else{module.value='__new__';moduleManual.value=want}show(moduleManualItem,module.value==='__new__');populateVars()}
function populateVars(){const m=mods.find(x=>x.moduleId===mid()),vars=(m?.vars||[]).filter(v=>['boolean','number','integer','string'].includes(v.type)),want=s.variableName||'';variable.innerHTML='';vars.forEach(v=>variable.add(new Option(`${v.title} [${v.type}]`,v.name)));variable.add(new Option('+ New / manual…','__new__'));if(vars.some(v=>v.name===want))variable.value=want;else{variable.value='__new__';variableManual.value=want}show(variableManualItem,variable.value==='__new__');applyDef()}
function applyDef(){const v=mods.find(x=>x.moduleId===mid())?.vars.find(x=>x.name===vn());if(v){type.value=v.type;type.disabled=true;if(!label.value)label.value=v.title;if(s.setValue==null&&v.def!=null)setValue.value=v.def}else type.disabled=false;show(valueItem,type.value!=='boolean')}
async function save(){const t=type.value;let val=setValue.value;if(t==='number'||t==='integer')val=Number(val)||0;s={...s,moduleId:mid(),variableName:vn()||undefined,variableType:t,label:label.value.trim()||undefined,setValue:val,defaultValue:s.defaultValue};await c.setSettings(s)}
async function load(){status.textContent='Loading Artemis variables…';status.className='status';await c.setGlobalSettings({...(await c.getGlobalSettings()||{}),protocol:protocol.value,host:host.value.trim()||D.host,port:Number(port.value)||D.port});try{const r=await fetch(new URL('json-modules',base()));if(!r.ok)throw Error(`HTTP ${r.status}`);const raw=await r.json();mods=Array.isArray(raw)?raw.map(parse).filter(x=>x.moduleId):[];populateModules();status.textContent=`Connected · ${mods.length} JSON module(s)`;status.className='status ok'}catch(e){mods=[];populateModules();status.textContent=`Artemis API unavailable: ${e?.message??e}`;status.className='status error'}}
async function init(){c=SDPIComponents.streamDeckClient;const g=await c.getGlobalSettings()||{},p=await c.getSettings();s=p?.settings??p??{};protocol.value=g.protocol==='https'?'https':D.protocol;host.value=g.host||D.host;port.value=g.port||D.port;label.value=s.label||'';setValue.value=s.setValue??'';type.value=s.variableType||'boolean';await load()}
module.onchange=async()=>{show(moduleManualItem,module.value==='__new__');populateVars();await save()};moduleManual.onchange=async()=>{populateVars();await save()};variable.onchange=async()=>{show(variableManualItem,variable.value==='__new__');applyDef();await save()};type.onchange=async()=>{show(valueItem,type.value!=='boolean');await save()};[variableManual,label,setValue].forEach(e=>e.onchange=save);[protocol,host,port].forEach(e=>e.onchange=load);window.addEventListener('DOMContentLoaded',()=>{const w=setInterval(()=>{if(window.SDPIComponents?.streamDeckClient){clearInterval(w);init()}},50);setTimeout(()=>clearInterval(w),10000)});
</script></body></html>
