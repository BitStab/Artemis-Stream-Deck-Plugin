<!doctype html><html><head lang="en"><meta charset="utf-8"/><title>Artemis Variable Dial</title><script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
<style>body{padding-bottom:10px}.status{font:12px system-ui,sans-serif;margin:8px 12px;opacity:.85}.ok{color:#73d673}.error{color:#ff7b72}input,select,textarea{width:100%;box-sizing:border-box}.row{display:flex;gap:6px;width:100%}.port{max-width:85px}.hidden{display:none}.section{font:600 11px system-ui,sans-serif;opacity:.65;margin:12px 12px 4px;text-transform:uppercase;letter-spacing:.04em}</style></head><body>
<sdpi-item label="Protocol"><select id="protocol"><option value="http">HTTP</option><option value="https">HTTPS</option></select></sdpi-item><sdpi-item label="Artemis"><div class="row"><input id="host"/><input id="port" class="port" type="number"/></div></sdpi-item><div id="status" class="status">Loading Artemis variables…</div>
<sdpi-item label="Module"><select id="module"></select></sdpi-item><sdpi-item id="moduleManualItem" class="hidden" label="New module"><input id="moduleManual" value="streamdeck"/></sdpi-item>
<sdpi-item label="Variable"><select id="variable"></select></sdpi-item>
<sdpi-item id="newTypeItem" label="Type"><select id="type"><option value="number">Number</option><option value="integer">Integer</option><option value="boolean">Boolean</option><option value="string">String / Enum</option></select></sdpi-item>
<sdpi-item id="variableManualItem" class="hidden" label="New variable"><input id="variableManual" placeholder="e.g. brightness"/></sdpi-item>
<sdpi-item label="Label"><input id="label"/></sdpi-item>
<div id="numeric" class="hidden"><div class="section">Numeric settings</div><sdpi-item label="Min / Max"><div class="row"><input id="minimum" type="number" step="any"/><input id="maximum" type="number" step="any"/></div></sdpi-item><sdpi-item label="Step"><input id="step" type="number" step="any" min="0.000001" value="1"/></sdpi-item><div class="status">Step controls how much one dial tick changes the value.</div><sdpi-item label="Default"><input id="defaultValue" type="number" step="any"/></sdpi-item><sdpi-item label="Suffix"><input id="suffix" placeholder="%, °C, rpm, …"/></sdpi-item></div>
<div id="stringFields" class="hidden"><div class="section">String / enum settings</div><sdpi-item label="Choices"><textarea id="choices" rows="4" placeholder="Static\nBreathing\nRainbow"></textarea></sdpi-item><sdpi-item label="Default"><input id="stringDefault"/></sdpi-item></div>
<div id="booleanHint" class="status hidden">Rotate right = ON, left = OFF. Press toggles.</div><div id="stringHint" class="status hidden">Rotate cycles through enum/choices. Press resets to the default choice.</div>
<script>
const D={protocol:'http',host:'127.0.0.1',port:9696,moduleId:'streamdeck',minimum:0,maximum:100,step:1,defaultValue:0};let c,s={},mods=[];const $=x=>document.getElementById(x);const protocol=$('protocol'),host=$('host'),port=$('port'),module=$('module'),moduleManual=$('moduleManual'),variable=$('variable'),variableManual=$('variableManual'),type=$('type'),label=$('label'),minimum=$('minimum'),maximum=$('maximum'),step=$('step'),defaultValue=$('defaultValue'),suffix=$('suffix'),choices=$('choices'),stringDefault=$('stringDefault'),numeric=$('numeric'),stringFields=$('stringFields'),booleanHint=$('booleanHint'),stringHint=$('stringHint'),status=$('status'),moduleManualItem=$('moduleManualItem'),variableManualItem=$('variableManualItem'),newTypeItem=$('newTypeItem');const rec=v=>v&&typeof v==='object'&&!Array.isArray(v),pick=(o,...k)=>{for(const x of k)if(o?.[x]!=null)return o[x]};
function base(){return`${protocol.value==='https'?'https':'http'}://${host.value.trim()||D.host}:${Number(port.value)||D.port}/`}function mid(){return module.value==='__new__'?(moduleManual.value.trim()||D.moduleId):module.value}function isNew(){return variable.value==='__new__'}function vn(){return isNew()?variableManual.value.trim():variable.value}function show(e,on){e.classList.toggle('hidden',!on)}function n(v,d){const x=Number(v);return Number.isFinite(x)?x:d}
function parse(x){const id=String(pick(x,'moduleId','ModuleId')??''),sc=pick(x,'schema','Schema')||{},ps=rec(sc.properties)?sc.properties:(rec(sc.Properties)?sc.Properties:{});return{moduleId:id,vars:Object.entries(ps).map(([name,v])=>({name,title:String(pick(v,'title','Title')??name),type:String(pick(v,'type','Type')??'').toLowerCase(),minimum:Number(pick(v,'minimum','Minimum')),maximum:Number(pick(v,'maximum','Maximum')),step:Number(pick(v,'multipleOf','MultipleOf')),suffix:String(pick(v,'x-suffix','xSuffix','Suffix')??''),def:pick(v,'default','Default'),enumValues:Array.isArray(pick(v,'enum','Enum'))?pick(v,'enum','Enum').map(String):[]}))}}
function populateModules(){const want=s.moduleId||D.moduleId;module.innerHTML='';mods.forEach(m=>module.add(new Option(m.moduleId,m.moduleId)));module.add(new Option('+ New / manual…','__new__'));if(mods.some(m=>m.moduleId===want))module.value=want;else{module.value='__new__';moduleManual.value=want}show(moduleManualItem,module.value==='__new__');populateVars()}
function populateVars(){const m=mods.find(x=>x.moduleId===mid()),vars=(m?.vars||[]).filter(v=>['boolean','number','integer','string'].includes(v.type)),want=s.variableName||'';variable.innerHTML='';vars.forEach(v=>variable.add(new Option(`${v.title} [${v.type}]`,v.name)));variable.add(new Option('+ New variable…','__new__'));if(vars.some(v=>v.name===want))variable.value=want;else{variable.value='__new__';variableManual.value=want}refreshVariableMode();applyDef()}
function refreshVariableMode(){show(newTypeItem,true);show(variableManualItem,isNew())}
function applyDef(){const v=mods.find(x=>x.moduleId===mid())?.vars.find(x=>x.name===vn());if(v&&!isNew()){if(!s.variableType)type.value=v.type;if(!label.value)label.value=v.title;if(Number.isFinite(v.minimum))minimum.value=v.minimum;if(Number.isFinite(v.maximum))maximum.value=v.maximum;if(Number.isFinite(v.step)&&v.step>0)step.value=v.step;if(v.suffix)suffix.value=v.suffix;if(v.def!=null){if(v.type==='string')stringDefault.value=String(v.def);else defaultValue.value=v.def}if(v.enumValues?.length)choices.value=v.enumValues.join('\n')}refreshType()}
function refreshType(){const t=type.value;show(numeric,t==='number'||t==='integer');show(stringFields,t==='string');show(booleanHint,t==='boolean');show(stringHint,t==='string')}
async function save(){const t=type.value,arr=choices.value.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);s={...s,moduleId:mid(),variableName:vn()||undefined,variableType:t,label:label.value.trim()||undefined,minimum:n(minimum.value,D.minimum),maximum:n(maximum.value,D.maximum),step:Math.abs(n(step.value,D.step))||1,defaultValue:t==='string'?stringDefault.value:t==='boolean'?false:n(defaultValue.value,D.defaultValue),suffix:suffix.value,choices:arr};await c.setSettings(s)}
async function load(){status.textContent='Loading Artemis variables…';status.className='status';await c.setGlobalSettings({...(await c.getGlobalSettings()||{}),protocol:protocol.value,host:host.value.trim()||D.host,port:Number(port.value)||D.port});try{const r=await fetch(new URL('json-modules',base()));if(!r.ok)throw Error(`HTTP ${r.status}`);const raw=await r.json();mods=Array.isArray(raw)?raw.map(parse).filter(x=>x.moduleId):[];populateModules();status.textContent=`Connected · ${mods.length} JSON module(s)`;status.className='status ok'}catch(e){mods=[];populateModules();status.textContent=`Artemis API unavailable: ${e?.message??e}`;status.className='status error'}}
async function init(){c=SDPIComponents.streamDeckClient;const g=await c.getGlobalSettings()||{},p=await c.getSettings();s=p?.settings??p??{};protocol.value=g.protocol==='https'?'https':D.protocol;host.value=g.host||D.host;port.value=g.port||D.port;label.value=s.label||'';minimum.value=s.minimum??D.minimum;maximum.value=s.maximum??D.maximum;step.value=s.step??D.step;defaultValue.value=typeof s.defaultValue==='number'?s.defaultValue:D.defaultValue;stringDefault.value=typeof s.defaultValue==='string'?s.defaultValue:'';suffix.value=s.suffix||'';choices.value=(s.choices||[]).join('\n');type.value=s.variableType||'number';await load();if(s.variableType)type.value=s.variableType;refreshType()}
module.onchange=async()=>{show(moduleManualItem,module.value==='__new__');populateVars();await save()};moduleManual.onchange=async()=>{populateVars();await save()};variable.onchange=async()=>{refreshVariableMode();applyDef();await save()};type.onchange=async()=>{refreshType();await save()};[variableManual,label,minimum,maximum,step,defaultValue,suffix,choices,stringDefault].forEach(e=>{e.addEventListener('change',save);e.addEventListener('blur',save)});[protocol,host,port].forEach(e=>e.onchange=load);window.addEventListener('DOMContentLoaded',()=>{const w=setInterval(()=>{if(window.SDPIComponents?.streamDeckClient){clearInterval(w);init()}},50);setTimeout(()=>clearInterval(w),10000)});
</script></body></html>
