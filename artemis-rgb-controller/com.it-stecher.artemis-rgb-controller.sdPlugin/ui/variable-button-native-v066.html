<sdpi-item label=""><sdpi-button id="saveSettings" data-i18n="save_settings">Save settings</sdpi-button></sdpi-item>
<script>
const D={protocol:'http',host:'127.0.0.1',port:9696,moduleId:'streamdeck',minimum:0,maximum:100,step:1,defaultValue:0};let c,s={},mods=[];const $=x=>document.getElementById(x),protocol=$('protocol'),host=$('host'),port=$('port'),module=$('module'),moduleManual=$('moduleManual'),variable=$('variable'),variableManual=$('variableManual'),type=$('type'),existingType=$('existingType'),label=$('label'),valueA=$('valueA'),valueB=$('valueB'),minimum=$('minimum'),maximum=$('maximum'),defaultValue=$('defaultValue'),suffix=$('suffix'),choices=$('choices'),stringDefault=$('stringDefault'),numeric=$('numeric'),stringFields=$('stringFields'),status=$('status'),targets=$('targets'),moduleManualItem=$('moduleManualItem'),variableManualItem=$('variableManualItem'),newTypeItem=$('newTypeItem'),existingTypeItem=$('existingTypeItem'),deleteVariableItem=$('deleteVariableItem'),deleteVariable=$('deleteVariable');const rec=v=>v&&typeof v==='object'&&!Array.isArray(v),pick=(o,...k)=>{for(const x of k)if(o?.[x]!=null)return o[x]};
function base(){return`${protocol.value==='https'?'https':'http'}://${host.value.trim()||D.host}:${Number(port.value)||D.port}/`}function mid(){return module.value==='__new__'?(moduleManual.value.trim()||D.moduleId):module.value}function isNew(){return variable.value==='__new__'}function vn(){return isNew()?variableManual.value.trim():variable.value}function show(e,on){e.classList.toggle('hidden',!on)}function n(v,d){const x=Number(v);return Number.isFinite(x)?x:d}
function parse(x){const id=String(pick(x,'moduleId','ModuleId')??''),sc=pick(x,'schema','Schema')||{},ps=rec(sc.properties)?sc.properties:(rec(sc.Properties)?sc.Properties:{});return{moduleId:id,schema:sc,vars:Object.entries(ps).map(([name,v])=>({name,title:String(pick(v,'title','Title')??name),type:String(pick(v,'type','Type')??'').toLowerCase(),minimum:Number(pick(v,'minimum','Minimum')),maximum:Number(pick(v,'maximum','Maximum')),step:Number(pick(v,'multipleOf','MultipleOf')),suffix:String(pick(v,'x-suffix','xSuffix','Suffix')??''),def:pick(v,'default','Default'),enumValues:Array.isArray(pick(v,'enum','Enum'))?pick(v,'enum','Enum').map(String):[]}))}}
function populateModules(){const want=s.moduleId||D.moduleId;module.innerHTML='';mods.forEach(m=>module.add(new Option(m.moduleId,m.moduleId)));module.add(new Option(t('new_manual'),'__new__'));if(mods.some(m=>m.moduleId===want))module.value=want;else{module.value='__new__';moduleManual.value=want}show(moduleManualItem,module.value==='__new__');populateVars()}
function populateVars(){const m=mods.find(x=>x.moduleId===mid()),vars=(m?.vars||[]).filter(v=>['boolean','number','integer','string'].includes(v.type)),want=s.variableName||'';variable.innerHTML='';vars.forEach(v=>variable.add(new Option(`${v.title} [${v.type}]`,v.name)));variable.add(new Option(t('new_var'),'__new__'));if(vars.some(v=>v.name===want))variable.value=want;else{variable.value='__new__';variableManual.value=want}refreshVariableMode();applyDef()}
function refreshVariableMode(){const x=isNew();show(newTypeItem,x);show(variableManualItem,x);show(existingTypeItem,!x);show(deleteVariableItem,!x&&module.value!=='__new__'&&!!variable.value)}
function applyDef(){const v=mods.find(x=>x.moduleId===mid())?.vars.find(x=>x.name===vn());if(v&&!isNew()){type.value=v.type;existingType.value=v.type;if(!label.value)label.value=v.title;if(Number.isFinite(v.minimum))minimum.value=v.minimum;if(Number.isFinite(v.maximum))maximum.value=v.maximum;if(v.suffix)suffix.value=v.suffix;if(v.def!=null){if(v.type==='string')stringDefault.value=String(v.def);else defaultValue.value=v.def}if(v.enumValues?.length)choices.value=v.enumValues.join('\n')}refreshType()}
function refreshType(){const t=type.value;show(targets,t!=='boolean');show(numeric,t==='number'||t==='integer');show(stringFields,t==='string');for(const e of [valueA,valueB]){if(t==='number'||t==='integer'){e.type='number';e.step=t==='integer'?'1':'any';e.inputMode='decimal'}else{e.type='text';e.removeAttribute('step');e.removeAttribute('inputmode')}}}

async function deleteSelectedVariable(){
  if(isNew()||module.value==='__new__'||!variable.value)return;
  const moduleId=mid(), variableName=variable.value;
  const m=mods.find(x=>x.moduleId===moduleId);
  if(!m?.schema){status.textContent=t('cannot_delete');status.className='pi-status error';return}
  if(!confirm(t('delete_confirm',{variable:variableName,module:moduleId})))return;
  try{
    const schema=JSON.parse(JSON.stringify(m.schema));
    const propsKey=rec(schema.properties)?'properties':(rec(schema.Properties)?'Properties':'properties');
    const props=rec(schema[propsKey])?{...schema[propsKey]}:{};
    delete props[variableName];
    schema[propsKey]=props;
    const r=await fetch(new URL(`json-modules/${encodeURIComponent(moduleId)}/schema`,base()),{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(schema)});
    if(!r.ok)throw Error(`HTTP ${r.status}: ${await r.text()}`);
    s={...s,variableName:undefined};
    await c.setSettings(s);
    status.textContent=t('deleted',{module:moduleId,variable:variableName});status.className='pi-status ok';
    await load();
  }catch(e){status.textContent=t('delete_failed',{error:e?.message??e});status.className='pi-status error'}
}

async function save(){const t=type.value,arr=choices.value.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);let a=valueA.value,b=valueB.value;if(t==='number'||t==='integer'){a=n(a,0);b=n(b,100)}s={...s,moduleId:mid(),variableName:vn()||undefined,variableType:t,label:label.value.trim()||undefined,valueA:a,valueB:b,minimum:n(minimum.value,D.minimum),maximum:n(maximum.value,D.maximum),suffix:suffix.value,defaultValue:t==='string'?stringDefault.value:t==='boolean'?false:n(defaultValue.value,D.defaultValue),enumValues:arr};await c.setSettings(s)}
async function load(){status.textContent=t('loading_vars');status.className='pi-status';await c.setGlobalSettings({...(await c.getGlobalSettings()||{}),protocol:protocol.value,host:host.value.trim()||D.host,port:Number(port.value)||D.port});try{const r=await fetch(new URL('json-modules',base()));if(!r.ok)throw Error(`HTTP ${r.status}`);const raw=await r.json();mods=Array.isArray(raw)?raw.map(parse).filter(x=>x.moduleId):[];populateModules();status.textContent=t('connected_modules',{count:mods.length});status.className='pi-status ok'}catch(e){mods=[];populateModules();status.textContent=t('api_unavailable',{error:e?.message??e});status.className='pi-status error'}}
async function init(){c=SDPIComponents.streamDeckClient;try{const ci=await c.getConnectionInfo();setLocale(ci?.application?.language ?? ci?.applicationInfo?.language ?? ci?.info?.application?.language ?? ci?.registrationInfo?.application?.language ?? navigator.language);try{await customElements.whenDefined('sdpi-item');applyI18n();}catch{}}catch{setLocale(navigator.language);}const g=await c.getGlobalSettings()||{},p=await c.getSettings();s=p?.settings??p??{};protocol.value=g.protocol==='https'?'https':D.protocol;host.value=g.host||D.host;port.value=g.port||D.port;label.value=s.label||'';valueA.value=s.valueA??s.setValue??'';valueB.value=s.valueB??'';minimum.value=s.minimum??D.minimum;maximum.value=s.maximum??D.maximum;defaultValue.value=typeof s.defaultValue==='number'?s.defaultValue:D.defaultValue;stringDefault.value=typeof s.defaultValue==='string'?s.defaultValue:'';suffix.value=s.suffix||'';choices.value=(s.enumValues||[]).join('\n');type.value=s.variableType||'boolean';await load();refreshType()}
module.onchange=async()=>{show(moduleManualItem,module.value==='__new__');populateVars();await save()};moduleManual.onchange=async()=>{populateVars();await save()};variable.onchange=async()=>{refreshVariableMode();applyDef();await save()};type.onchange=async()=>{refreshType();await save()};[variableManual,label,valueA,valueB,minimum,maximum,defaultValue,suffix,choices,stringDefault].forEach(e=>{e.addEventListener('change',save);e.addEventListener('blur',save)});[protocol,host,port].forEach(e=>e.onchange=load);deleteVariable.onclick=deleteSelectedVariable;document.getElementById("saveSettings").onclick=save;window.addEventListener('DOMContentLoaded',()=>{const w=setInterval(()=>{if(window.SDPIComponents?.streamDeckClient){clearInterval(w);init()}},50);setTimeout(()=>clearInterval(w),10000)});
</script></body></html>
